<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mobile homepage capture</title><style>html,body{margin:0;padding:0;width:390px;background:#fcf7ef}iframe{display:block;width:390px;height:844px;border:0}</style></head><body><iframe id="homepage" title="New Stylish Tailors Boutique homepage at a 390 pixel mobile viewport" src="../index.html"></iframe><script>const frame=document.getElementById('homepage');frame.addEventListener('load',async()=>{const images=[...frame.contentDocument.images];images.forEach(image=>image.loading='eager');await Promise.all(images.map(image=>image.decode().catch(()=>{})));const resize=()=>{const h=frame.contentDocument.documentElement.scrollHeight;frame.style.height=h+'px';document.title='Mobile homepage capture 390x'+h};resize();setTimeout(resize,1500)});</script></body></html>
